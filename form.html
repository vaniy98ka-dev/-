<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arôme café — Бронювання</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo">Arôme <span>café</span></a>
            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Головна</a></li>
                    <li><a href="menu.html" class="nav-link">Меню</a></li>
                    <li><a href="gallery.html" class="nav-link">Галерея</a></li>
                    <li><a href="form.html" class="nav-link active">Бронювання</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="content-wrapper booking-page">
        <div class="booking-card">
            <h2>Забронювати столик</h2>
            <form action="#">
                <div class="form-group">
                    <label for="name">Ваше ім'я</label>
                    <input type="text" id="name" placeholder="Введіть ім'я" required>
                </div>
                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input type="tel" id="phone" placeholder="+380" required>
                </div>
                <div class="form-group">
                    <label for="guests">Кількість гостей</label>
                    <select id="guests">
                        <option value="1">1 особа</option>
                        <option value="2" selected>2 особи</option>
                        <option value="3">3 особи</option>
                        <option value="4">4 особи</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Надіслати заявку</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <p>&copy; 2026 Arôme café.</p>
        </div>
    </footer>

</body>
</html>
